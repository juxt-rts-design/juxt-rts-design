<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="juxt-rts-design  Ethical Hacker & Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b0a"/>
      <stop offset="55%" stop-color="#0c1412"/>
      <stop offset="100%" stop-color="#101a14"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1aff8c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1aff8c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1aff8c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1aff8c" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <!-- left accent bar (avatar red) -->
    <rect x="0" y="0" width="8" height="360" fill="#c41e3a"/>

    <!-- subtle scanline -->
    <rect x="0" y="0" width="1200" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;360;-80" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- terminal chrome -->
    <rect x="56" y="48" width="720" height="264" rx="10" fill="#050807" stroke="#1aff8c" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="56" y="48" width="720" height="36" rx="10" fill="#0a1210"/>
    <circle cx="78" cy="66" r="6" fill="#c41e3a"/>
    <circle cx="98" cy="66" r="6" fill="#e6b422"/>
    <circle cx="118" cy="66" r="6" fill="#1aff8c"/>
    <text x="160" y="71" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7a9e8c">root@juxt-rts-design:~</text>

    <!-- terminal body -->
    <text x="80" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1aff8c">$ whoami</text>
    <text x="80" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#e8fff4">juxt-rts-design  Ethical Hacker &amp; Developer</text>

    <text x="80" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1aff8c">$ cat mission.txt</text>
    <text x="80" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#9fd9bc">Break systems. Understand them. Rebuild them stronger.</text>
    <text x="80" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#9fd9bc">Offensive mindset � Defensive craft � Clean code</text>

    <text x="80" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#1aff8c">$ _</text>
    <rect x="98" y="264" width="10" height="18" fill="#1aff8c">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- right panel -->
    <g transform="translate(820, 64)">
      <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7a9e8c" letter-spacing="2">STATUS</text>
      <text y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#1aff8c" font-weight="700">ONLINE</text>

      <text y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7a9e8c" letter-spacing="2">FOCUS</text>
      <text y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#e8fff4">Pentest � Web � PHP</text>
      <text y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#e8fff4">AppSec � Automation</text>

      <text y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7a9e8c" letter-spacing="2">CLEARANCE</text>
      <text y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#c41e3a">ETHICAL ONLY</text>

      <!-- pulse ring -->
      <circle cx="280" cy="28" r="8" fill="none" stroke="#1aff8c" stroke-width="2">
        <animate attributeName="r" values="6;16;6" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="280" cy="28" r="5" fill="#1aff8c"/>
    </g>
  </g>
</svg>
